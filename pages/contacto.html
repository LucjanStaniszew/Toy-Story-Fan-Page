<body>
    <header class="sticky-top">
        <nav class="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/logo.png" alt="Hola soy el texto alternativo de el Logo" class="logo">
                </a>
                <h1 class="fw-bold">Toy Story Fan Page</h1>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto text-center">
                        <li class="nav-item">
                            <a class="nav-link fs-4 fw-semibold" href="./peliculas.html">Peliculas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-4 fw-semibold" href="./personajes.html">Personajes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-4 fw-semibold" href="./galeria.html">Galería</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active fs-4 fw-semibold" aria-current="page" href="./contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="cont">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13537.320922203322!2d-64.5550993382202!3d-31.97906229513999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95d2b0447c2bd5ff%3A0x3245f2bd7c030f4c!2sPlaza%20Jose%20Hernandez!5e0!3m2!1ses!2sar!4v1770773535797!5m2!1ses!2sar" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <form action="" class="form">
            <label for="name">Nombre:</label>
            <input type="text" id="name" placeholder="John">

            <label for="surname">Apellido:</label>
            <input type="text" id="surname" placeholder="Doe">

            <label for="mail">e-Mail:</label>
            <input type="email" id="mail" placeholder="johndoe@gmail.com">

            <label for="phone">Telefono:</label>
            <input type="tel" id="phone" placeholder="123456789">

            <label for="age">Edad:</label>
            <input type="number" id="age" placeholder="25">

            <label for="pass">Contraseña</label>
            <input type="password" id="pass">
            
            <article class="btns">
                <input type="submit" value="Enviar" class="form-btn">
                <input type="reset" value="Comenzar de nuevo" class="form-btn">
            </article>
        </form>


        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/album/47OFnLtLVi5WrPYNXAwFGh?utm_source=generator" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </main>

    <footer>
        <h2>Derechos Reservados</h2>
        <h2>Pagina creada por Lucho ❤️</h2>
        <nav>
            <ul class="rs">

                </li>
                <li>
                    <a href="https://open.spotify.com/intl-es/album/47OFnLtLVi5WrPYNXAwFGh" target="_blank">
                        <img src="../assets/logos/spotify.png" alt="Logo de Spotify" class="rrss">
                    </a>
                </li>
                <li>
                    <a href="https://web.whatsapp.com/" target="_blank">
                        <img src="../assets/logos/whatsapp.png" alt="Logo de Whatsapp" class="rrss wa">

                </li>

        </nav>
